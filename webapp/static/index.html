<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriChain v3 explorer</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>AgriChain v3</h1>
      <p>Ledger-ordered messages from phones, SMS, LoRa and BLE gateways.</p>
    </div>
    <div class="actions">
      <span id="ledger" class="pill">connecting…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <section id="stats" class="stats" aria-label="Ledger statistics"></section>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-feed="messages" type="button">Messages</button>
        <button class="tab" data-feed="listings" type="button">Listings</button>
        <button class="tab" data-feed="orders" type="button">Orders</button>
        <button class="tab" data-feed="trades" type="button">Trades</button>
        <button class="tab" data-feed="prices" type="button">Prices</button>
      </div>
      <div id="feed" class="feed">Loading…</div>
    </section>
    <footer>
      <span>Independent client signatures; the ledger assigns seq and signs receipts.</span>
      <a href="/explorer">Ledger explorer ↗</a>
    </footer>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
